<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Peta Aftersales Elitech</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <h1>PETA AFTERSALES ELITECH</h1>
  <p class="subtitle">Warna = beban komplain distributor yang menangani wilayah ini</p>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Cari distributor / provinsi" autocomplete="off">
    <button id="searchBtn" aria-label="Cari">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <div id="searchDropdown" class="search-dropdown hidden"></div>
  </div>
  <button id="nonDistBtn" class="non-dist-btn">Komplain non-distributor <span id="nonDistCount"></span></button>
</header>
<main id="mapStage">
  <svg id="map" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="hoverLabel" class="hover-label hidden"></div>
  <div id="legend" class="legend"></div>
</main>
<div id="overlay" class="overlay hidden"></div>
<aside id="panel" class="panel hidden">
  <div class="panel-header">
    <h2 id="panelTitle">-</h2>
    <button id="panelClose" aria-label="Tutup">&times;</button>
  </div>
  <div id="panelBody" class="panel-body"></div>
</aside>
<div id="toast" class="toast hidden">Disalin!</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
